services:
  # Database Layer (Member 2)
  postgres:
    image: postgis/postgis:15-3.3
    container_name: bluebyte_db
    environment:
      POSTGRES_DB: bluebyte
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Ingestion & Streaming Broker (Member 3 & 4)
  telemetry-broker:
    build:
      context: ./server
      dockerfile: Dockerfile.broker
    container_name: bluebyte_broker
    ports:
      - "5555:5555" # ZMQ PUB/SUB
      - "5556:5556" # ZMQ ROUTER/DEALER
    restart: unless-stopped

  # FastAPI Backend & WebSocket Bridge (Member 4)
  api-gateway:
    build:
      context: ./server
      dockerfile: Dockerfile.api
    container_name: bluebyte_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:secretpassword@postgres:5432/bluebyte
      - ZMQ_BROKER_URL=tcp://telemetry-broker:5555
    depends_on:
      - postgres
      - telemetry-broker
    restart: unless-stopped

  # Frontend Web UI (Member 6)
  web-ui:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bluebyte_ui
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  pgdata:
